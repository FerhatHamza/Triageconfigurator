<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triage Configurator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <div class="container mx-auto p-4 max-w-6xl">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-blue-800">🩺 Triage Emergency</h1>
      <div class="flex gap-2">
        <button id="doctorBtn" class="bg-blue-100 hover:bg-blue-200 px-4 py-2 rounded text-sm">👨‍⚕️ Médecin</button>
        <button id="adminBtn" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded text-sm">🔒 Admin</button>
      </div>
    </div>

    <!-- Simulator -->
    <section class="bg-white rounded-lg shadow p-4 mb-6">
      <h2 class="text-xl font-semibold mb-4">Simulateur de triage</h2>
      <div id="simulator" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      <div class="mt-6 flex flex-col sm:flex-row items-start sm:items-center gap-4">
        <button id="calculateBtn" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Calculer</button>
        <div id="ticketPreview" class="border rounded-lg p-4 bg-gray-100 w-full sm:w-64">
          <p class="text-sm text-gray-500">Aperçu du ticket</p>
          <div id="ticketColor" class="text-4xl font-black mt-1">-</div>
          <p id="ticketLevel" class="text-lg font-medium"></p>
          <p id="ticketScore" class="text-sm text-gray-600"></p>
        </div>
      </div>
    </section>

    <!-- Config Editor (hidden, shown after doctor or admin login) -->
    <section id="editorSection" class="bg-white rounded-lg shadow p-4 hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Éditeur de configuration</h2>
        <button id="saveProposalBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 text-sm">💾 Proposer</button>
      </div>
      <p id="editorHint" class="text-sm text-gray-500 mb-2"></p>
      <div id="configEditor"></div>
    </section>

    <!-- Admin proposals list (hidden) -->
    <section id="adminListSection" class="bg-white rounded-lg shadow p-4 hidden">
      <h2 class="text-xl font-semibold mb-4">Configurations proposées</h2>
      <div id="proposalsList" class="space-y-2"></div>
    </section>
  </div>

  <!-- Login Modal (shared for doctor/admin) -->
  <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg p-6 w-80">
      <h3 id="loginTitle" class="text-lg font-bold mb-3">Code médecin</h3>
      <input type="password" id="loginCodeInput" placeholder="Entrez votre code" class="w-full border rounded px-3 py-2 mb-3">
      <div class="flex justify-end gap-2">
        <button id="cancelLogin" class="px-4 py-2 bg-gray-200 rounded">Annuler</button>
        <button id="submitLogin" class="px-4 py-2 bg-blue-600 text-white rounded">Valider</button>
      </div>
      <p id="loginError" class="text-red-500 text-sm mt-2 hidden">Code incorrect</p>
    </div>
  </div>

  <script>
    let activeConfig = null;
    let doctorCode = null;
    let adminCode = null;
    const API = 'https://billowing-voice-4271.didcrist.workers.dev/api';

    // --- Load active config ---
    async function loadActive() {
      const res = await fetch(`${API}/config`);
      const text = await res.text();
      activeConfig = JSON.parse(text);
      renderSimulator();
      if (doctorCode || adminCode) showEditor();
    }

    // --- Simulator ---
    function renderSimulator() {
      const container = document.getElementById('simulator');
      container.innerHTML = '';
      for (const [key, cat] of Object.entries(activeConfig)) {
        if (['thresholds','colors','levels'].includes(key)) continue;
        const div = document.createElement('div');
        div.className = 'border p-3 rounded';
        div.innerHTML = `<label class="block text-sm font-medium mb-1 capitalize">${key.replace(/_/g,' ')}</label>`;
        const select = document.createElement('select');
        select.className = 'w-full border rounded px-2 py-1 text-sm';
        select.dataset.category = key;
        cat.options.forEach((opt,i) => {
          select.innerHTML += `<option value="${cat.scores[i]}">${opt} (score: ${cat.scores[i]})</option>`;
        });
        div.appendChild(select);
        container.appendChild(div);
      }
    }

    document.getElementById('calculateBtn').onclick = () => {
      let total = 0;
      document.querySelectorAll('#simulator select').forEach(s => total += parseInt(s.value)||0);
      const [gmax, ymax, omax] = activeConfig.thresholds;
      let idx = 0;
      if (total <= gmax) idx = 0;
      else if (total <= ymax) idx = 1;
      else if (total <= omax) idx = 2;
      else idx = 3;
      const color = activeConfig.colors[idx];
      const tc = document.getElementById('ticketColor');
      tc.textContent = '⬛';
      tc.className = `text-4xl font-black mt-1 ${{
        green:'text-green-600', yellow:'text-yellow-500', orange:'text-orange-500', red:'text-red-600'
      }[color] || 'text-gray-600'}`;
      document.getElementById('ticketLevel').textContent = activeConfig.levels[idx];
      document.getElementById('ticketScore').textContent = `Score : ${total}`;
    };

    // --- Editor ---
    function showEditor() {
      document.getElementById('editorSection').classList.remove('hidden');
      const hint = document.getElementById('editorHint');
      hint.textContent = doctorCode ? `Médecin connecté (code: ${doctorCode}). Modifiez puis proposez.` :
                         adminCode ? `Mode administrateur – vous pouvez tout modifier et activer.` : '';
      const editor = document.getElementById('configEditor');
      editor.innerHTML = '';
      // categories
      for (const [key, cat] of Object.entries(activeConfig)) {
        if (['thresholds','colors','levels'].includes(key)) continue;
        const card = document.createElement('div');
        card.className = 'mb-4 border rounded p-3';
        card.innerHTML = `<h3 class="font-medium mb-2 capitalize">${key.replace(/_/g,' ')}</h3>`;
        const table = document.createElement('table');
        table.className = 'w-full text-sm';
        table.innerHTML = '<thead><tr><th>Option</th><th>Score</th></tr></thead><tbody></tbody>';
        const tbody = table.querySelector('tbody');
        cat.options.forEach((opt,i) => {
          tbody.innerHTML += `<tr>
            <td class="py-1 pr-2"><input type="text" value="${opt}" data-cat="${key}" data-idx="${i}" data-field="option" class="w-full border rounded px-1"></td>
            <td><input type="number" value="${cat.scores[i]}" data-cat="${key}" data-idx="${i}" data-field="score" class="w-16 border rounded px-1"></td>
          </tr>`;
        });
        card.appendChild(table);
        const addBtn = document.createElement('button');
        addBtn.textContent = '+ Ajouter une option';
        addBtn.className = 'text-blue-600 text-sm mt-2';
        addBtn.onclick = () => {
          cat.options.push('Nouveau');
          cat.scores.push(0);
          showEditor();
        };
        card.appendChild(addBtn);
        editor.appendChild(card);
      }
      // thresholds
      const thCard = document.createElement('div');
      thCard.className = 'mb-4 border rounded p-3';
      thCard.innerHTML = '<h3 class="font-medium mb-2">Seuils (max Vert, Jaune, Orange)</h3>';
      thCard.innerHTML += ['Vert max','Jaune max','Orange max'].map((l,i) =>
        `<label class="mr-2">${l}<input type="number" value="${activeConfig.thresholds[i]}" data-threshold="${i}" class="ml-1 border rounded w-20 px-1"></label>`).join('');
      editor.appendChild(thCard);
      // colors/levels
      editor.innerHTML += `<div class="mb-4 border rounded p-3">
        <h3 class="font-medium mb-2">Couleurs & Niveaux</h3>
        ${[0,1,2,3].map(i => `<div class="grid grid-cols-2 gap-2 text-sm mb-1">
          <input type="text" value="${activeConfig.colors[i]}" data-color="${i}" class="border rounded px-1">
          <input type="text" value="${activeConfig.levels[i]}" data-level="${i}" class="border rounded px-1">
        </div>`).join('')}
      </div>`;

      // attach listeners
      editor.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('change', function() {
          if (this.dataset.cat && this.dataset.field === 'option')
            activeConfig[this.dataset.cat].options[parseInt(this.dataset.idx)] = this.value;
          else if (this.dataset.cat && this.dataset.field === 'score')
            activeConfig[this.dataset.cat].scores[parseInt(this.dataset.idx)] = parseInt(this.value)||0;
          else if (this.dataset.threshold !== undefined)
            activeConfig.thresholds[parseInt(this.dataset.threshold)] = parseInt(this.value)||0;
          else if (this.dataset.color !== undefined) activeConfig.colors[parseInt(this.dataset.color)] = this.value;
          else if (this.dataset.level !== undefined) activeConfig.levels[parseInt(this.dataset.level)] = this.value;
        });
      });
    }

    // --- Proposal saving (doctor) ---
    document.getElementById('saveProposalBtn').onclick = async () => {
      if (!doctorCode) return alert('Connectez-vous en tant que médecin.');
      const name = prompt('Nom de la configuration :', 'Proposition ' + new Date().toLocaleString());
      if (!name) return;
      const desc = prompt('Description (optionnelle) :');
      const res = await fetch(`${API}/config/propose`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Doctor-Code': doctorCode },
        body: JSON.stringify({ name, description: desc, json_data: activeConfig })
      });
      if (res.ok) alert('Proposition envoyée à l’administrateur.');
      else alert('Erreur');
    };

    // --- Modal logic ---
    const modal = document.getElementById('loginModal');
    const title = document.getElementById('loginTitle');
    let mode = ''; // 'doctor' or 'admin'

    function openModal(m) {
      mode = m;
      title.textContent = m === 'doctor' ? 'Code médecin' : 'Code administrateur';
      document.getElementById('loginCodeInput').value = '';
      document.getElementById('loginError').classList.add('hidden');
      modal.classList.remove('hidden');
    }

    document.getElementById('doctorBtn').onclick = () => openModal('doctor');
    document.getElementById('adminBtn').onclick = () => openModal('admin');
    document.getElementById('cancelLogin').onclick = () => modal.classList.add('hidden');

    document.getElementById('submitLogin').onclick = async () => {
      const code = document.getElementById('loginCodeInput').value.trim();
      if (!code) return;
      if (mode === 'doctor') {
        const res = await fetch(`${API}/doctor/validate`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code}) });
        if (res.ok && (await res.json()).valid) {
          doctorCode = code; adminCode = null;
          modal.classList.add('hidden');
          showEditor();
          document.getElementById('saveProposalBtn').style.display = 'inline-block';
          document.getElementById('adminListSection').classList.add('hidden');
        } else document.getElementById('loginError').classList.remove('hidden');
      } else {
        const res = await fetch(`${API}/config/list`, { headers:{'X-Admin-Code':code} });
        if (res.ok) {
          adminCode = code; doctorCode = null;
          modal.classList.add('hidden');
          showEditor();
          document.getElementById('saveProposalBtn').style.display = 'none';
          loadProposals();
        } else document.getElementById('loginError').classList.remove('hidden');
      }
    };

    // --- Admin proposals list & activation ---
    async function loadProposals() {
      if (!adminCode) return;
      const list = document.getElementById('proposalsList');
      const res = await fetch(`${API}/config/list`, { headers: {'X-Admin-Code': adminCode} });
      const configs = await res.json();
      document.getElementById('adminListSection').classList.remove('hidden');
      list.innerHTML = configs.map(c => `
        <div class="p-3 border rounded">
          <span class="font-medium">${c.name}</span>
          <span class="text-sm text-gray-500 ml-2">(${c.status})</span>
          ${c.doctor_code ? `<span class="text-xs ml-2">par ${c.doctor_code}</span>` : ''}
          <div class="mt-1">
            <button onclick="activateConfig(${c.id})" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">Activer</button>
          </div>
        </div>`).join('');
    }

    window.activateConfig = async (id) => {
      if (!adminCode) return;
      await fetch(`${API}/config/activate`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Code': adminCode },
        body: JSON.stringify({ id })
      });
      await loadActive();
      loadProposals();
    };

    // Init
    loadActive();
  </script>
</body>
</html>
