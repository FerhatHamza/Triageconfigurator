<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triage Configurator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #ticket, #ticket * { visibility: visible; }
      #ticket { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <div class="container mx-auto p-4 max-w-6xl">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-blue-800">🩺 Triage Emergency</h1>
      <button id="adminBtn" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded text-sm">🔒 admin</button>
    </div>

    <!-- Simulator -->
    <section class="bg-white rounded-lg shadow p-4 mb-6">
      <h2 class="text-xl font-semibold mb-4">Simulateur de triage</h2>
      <div id="simulator" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- dynamically filled -->
      </div>
      <div class="mt-6 flex flex-col sm:flex-row items-start sm:items-center gap-4">
        <button id="calculateBtn" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Calculer</button>
        <div id="ticketPreview" class="border rounded-lg p-4 bg-gray-100 w-full sm:w-64">
          <p class="text-sm text-gray-500">Aperçu du ticket</p>
          <div id="ticketColor" class="text-4xl font-black mt-1">-</div>
          <p id="ticketLevel" class="text-lg font-medium"></p>
          <p id="ticketScore" class="text-sm text-gray-600"></p>
        </div>
      </div>
    </section>

    <!-- Config Editor (hidden initially, unlocked by admin code) -->
    <section id="editorSection" class="bg-white rounded-lg shadow p-4 hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Éditeur de configuration</h2>
        <button id="saveNewProposal" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 text-sm">💾 Proposer</button>
      </div>
      <p class="text-sm text-gray-500 mb-2">Modifiez les scores, les seuils et les couleurs. Un code admin est requis pour activer une configuration.</p>
      <div id="configEditor">
        <!-- categories and thresholds will be rendered here -->
      </div>
    </section>
  </div>

  <!-- Admin Code Modal -->
  <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg p-6 w-80">
      <h3 class="text-lg font-bold mb-3">Code administrateur</h3>
      <input type="password" id="adminCodeInput" placeholder="Entrez le code" class="w-full border rounded px-3 py-2 mb-3">
      <div class="flex justify-end gap-2">
        <button id="cancelAdmin" class="px-4 py-2 bg-gray-200 rounded">Annuler</button>
        <button id="submitAdmin" class="px-4 py-2 bg-blue-600 text-white rounded">Valider</button>
      </div>
      <p id="adminError" class="text-red-500 text-sm mt-2 hidden">Code incorrect</p>
    </div>
  </div>

  <script>
    // ---- Global state ----
    let activeConfig = null;           // parsed JSON of active config
    let adminAuthenticated = false;
    const API_BASE = '/api';

    // ---- Fetch active config on load ----
    async function loadActiveConfig() {
      try {
        const res = await fetch(`${API_BASE}/config`);
        if (!res.ok) throw new Error('Failed to load config');
        const text = await res.text(); // D1 stores JSON as string
        activeConfig = JSON.parse(text);
        renderSimulator();
        // If admin already authenticated, also show editor
        if (adminAuthenticated) showEditor();
      } catch (e) {
        console.error(e);
        alert('Impossible de charger la configuration active.');
      }
    }

    // ---- Render the simulator form ----
    function renderSimulator() {
      if (!activeConfig) return;
      const container = document.getElementById('simulator');
      container.innerHTML = '';

      // Loop over categories (excluding thresholds/colors/levels)
      for (const [key, cat] of Object.entries(activeConfig)) {
        if (['thresholds','colors','levels'].includes(key)) continue;
        const div = document.createElement('div');
        div.className = 'border p-3 rounded';
        const label = document.createElement('label');
        label.className = 'block text-sm font-medium mb-1 capitalize';
        label.textContent = key.replace(/_/g, ' ');
        div.appendChild(label);

        const select = document.createElement('select');
        select.className = 'w-full border rounded px-2 py-1 text-sm';
        select.dataset.category = key;
        cat.options.forEach((opt, i) => {
          const option = document.createElement('option');
          option.value = cat.scores[i];
          option.textContent = `${opt} (score: ${cat.scores[i]})`;
          select.appendChild(option);
        });
        div.appendChild(select);
        container.appendChild(div);
      }

      // Clear previous ticket
      document.getElementById('ticketColor').textContent = '-';
      document.getElementById('ticketLevel').textContent = '';
      document.getElementById('ticketScore').textContent = '';
    }

    // ---- Calculate total score and update ticket ----
    document.getElementById('calculateBtn').addEventListener('click', () => {
      if (!activeConfig) return;
      const selects = document.querySelectorAll('#simulator select');
      let total = 0;
      selects.forEach(sel => { total += parseInt(sel.value) || 0; });

      // Determine triage level using thresholds
      const thresholds = activeConfig.thresholds; // [greenMax, yellowMax, orangeMax, redMin?]
      // Actually array of 4 numbers: green ≤ threshold[0], yellow ≤ threshold[1], orange ≤ threshold[2], red > threshold[2]
      let levelIdx = 0;
      if (total <= thresholds[0]) levelIdx = 0;
      else if (total <= thresholds[1]) levelIdx = 1;
      else if (total <= thresholds[2]) levelIdx = 2;
      else levelIdx = 3;

      const color = activeConfig.colors[levelIdx];
      const level = activeConfig.levels[levelIdx];

      // Update ticket preview
      const ticketColor = document.getElementById('ticketColor');
      ticketColor.textContent = '⬛'; // large square
      ticketColor.className = `text-4xl font-black mt-1`;
      // Map color names to tailwind classes
      const colorMap = {
        green: 'text-green-600',
        yellow: 'text-yellow-500',
        orange: 'text-orange-500',
        red: 'text-red-600'
      };
      ticketColor.classList.add(colorMap[color] || 'text-gray-600');

      document.getElementById('ticketLevel').textContent = level;
      document.getElementById('ticketScore').textContent = `Score total : ${total}`;
    });

    // ---- Admin modal ----
    const adminBtn = document.getElementById('adminBtn');
    const adminModal = document.getElementById('adminModal');
    const cancelAdmin = document.getElementById('cancelAdmin');
    const submitAdmin = document.getElementById('submitAdmin');
    const adminCodeInput = document.getElementById('adminCodeInput');
    const adminError = document.getElementById('adminError');

    adminBtn.addEventListener('click', () => {
      if (adminAuthenticated) {
        // Already logged in, show editor and maybe provide logout
        showEditor();
        return;
      }
      adminModal.classList.remove('hidden');
      adminCodeInput.value = '';
      adminError.classList.add('hidden');
    });

    cancelAdmin.addEventListener('click', () => adminModal.classList.add('hidden'));
    submitAdmin.addEventListener('click', async () => {
      const code = adminCodeInput.value.trim();
      if (!code) return;
      // Verify by trying to fetch list of configs (which requires admin code)
      try {
        const res = await fetch(`${API_BASE}/config/list`, {
          headers: { 'X-Admin-Code': code }
        });
        if (res.ok) {
          adminAuthenticated = true;
          adminModal.classList.add('hidden');
          adminBtn.textContent = '🔓 admin ✓';
          showEditor();
        } else {
          adminError.classList.remove('hidden');
        }
      } catch {
        adminError.classList.remove('hidden');
      }
    });

    // ---- Show config editor ----
    function showEditor() {
      if (!activeConfig) return;
      document.getElementById('editorSection').classList.remove('hidden');
      const editorContainer = document.getElementById('configEditor');
      editorContainer.innerHTML = '';

      // Render each category as an editable table
      for (const [key, cat] of Object.entries(activeConfig)) {
        if (['thresholds','colors','levels'].includes(key)) continue;
        const card = document.createElement('div');
        card.className = 'mb-4 border rounded p-3';
        card.innerHTML = `<h3 class="font-medium mb-2 capitalize">${key.replace(/_/g, ' ')}</h3>`;

        const table = document.createElement('table');
        table.className = 'w-full text-sm';
        table.innerHTML = `<thead><tr><th class="text-left">Option</th><th class="text-left">Score</th></tr></thead><tbody></tbody>`;
        const tbody = table.querySelector('tbody');
        cat.options.forEach((opt, i) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="py-1 pr-2"><input type="text" value="${opt}" class="w-full border rounded px-1" data-cat="${key}" data-idx="${i}" data-field="option"></td>
            <td><input type="number" value="${cat.scores[i]}" class="w-16 border rounded px-1" data-cat="${key}" data-idx="${i}" data-field="score"></td>
          `;
          tbody.appendChild(row);
        });
        card.appendChild(table);
        // Add row button
        const addBtn = document.createElement('button');
        addBtn.textContent = '+ Ajouter une option';
        addBtn.className = 'text-blue-600 text-sm mt-2';
        addBtn.addEventListener('click', () => {
          cat.options.push('Nouveau');
          cat.scores.push(0);
          showEditor(); // re-render (simple approach)
        });
        card.appendChild(addBtn);
        editorContainer.appendChild(card);
      }

      // Thresholds editor
      const thCard = document.createElement('div');
      thCard.className = 'mb-4 border rounded p-3';
      thCard.innerHTML = '<h3 class="font-medium mb-2">Seuils (max pour Vert, Jaune, Orange)</h3>';
      const thInputs = document.createElement('div');
      thInputs.className = 'flex gap-4 flex-wrap';
      ['Vert max','Jaune max','Orange max'].forEach((label, idx) => {
        const div = document.createElement('div');
        div.innerHTML = `<label class="block text-xs">${label}</label><input type="number" value="${activeConfig.thresholds[idx]}" class="border rounded px-2 py-1 w-20" data-threshold="${idx}">`;
        thInputs.appendChild(div);
      });
      thCard.appendChild(thInputs);

      // Colors and levels
      const clCard = document.createElement('div');
      clCard.className = 'mb-4 border rounded p-3';
      clCard.innerHTML = '<h3 class="font-medium mb-2">Couleurs & Niveaux</h3>';
      const clGrid = document.createElement('div');
      clGrid.className = 'grid grid-cols-4 gap-2 text-sm';
      for (let i = 0; i < 4; i++) {
        clGrid.innerHTML += `
          <div>
            <label class="block text-xs">Couleur</label>
            <input type="text" value="${activeConfig.colors[i]}" data-color="${i}" class="border rounded px-1 w-full">
          </div>
          <div>
            <label class="block text-xs">Niveau</label>
            <input type="text" value="${activeConfig.levels[i]}" data-level="${i}" class="border rounded px-1 w-full">
          </div>
        `;
      }
      clCard.appendChild(clGrid);
      editorContainer.appendChild(thCard);
      editorContainer.appendChild(clCard);

      // Attach change listeners to update activeConfig in memory
      document.querySelectorAll('#configEditor input').forEach(inp => {
        inp.addEventListener('change', function() {
          const cat = this.dataset.cat;
          const idx = parseInt(this.dataset.idx);
          const field = this.dataset.field;
          if (cat && field) {
            if (field === 'option') activeConfig[cat].options[idx] = this.value;
            else if (field === 'score') activeConfig[cat].scores[idx] = parseInt(this.value) || 0;
          } else if (this.dataset.threshold !== undefined) {
            activeConfig.thresholds[parseInt(this.dataset.threshold)] = parseInt(this.value) || 0;
          } else if (this.dataset.color !== undefined) {
            activeConfig.colors[parseInt(this.dataset.color)] = this.value;
          } else if (this.dataset.level !== undefined) {
            activeConfig.levels[parseInt(this.dataset.level)] = this.value;
          }
        });
      });
    }

    // ---- Save new proposal ----
    document.getElementById('saveNewProposal').addEventListener('click', async () => {
      if (!activeConfig) return;
      const name = prompt('Nom de la proposition :', 'Proposition ' + new Date().toLocaleString());
      if (!name) return;
      const description = prompt('Description (optionnelle) :');
      try {
        const res = await fetch(`${API_BASE}/config/propose`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            description,
            json_data: activeConfig
          })
        });
        if (res.ok) {
          alert('Proposition sauvegardée ! Un administrateur peut maintenant l’activer.');
        } else {
          const err = await res.json();
          alert('Erreur : ' + err.error);
        }
      } catch (e) {
        alert('Erreur réseau');
      }
    });

    // ---- Init ----
    loadActiveConfig();
  </script>
</body>
</html>
