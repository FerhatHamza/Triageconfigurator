<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triage Emergency</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-6 max-w-6xl">
    
    <!-- HEADER -->
    <div class="bg-white rounded-lg shadow p-4 mb-6 flex justify-between items-center flex-wrap gap-2">
      <h1 class="text-2xl font-bold text-blue-800">🏥 Triage Emergency</h1>
      <div class="flex gap-2">
        <button onclick="showLogin('doctor')" id="doctorBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 text-sm">
          👨‍⚕️ Médecin
        </button>
        <button onclick="showLogin('admin')" id="adminBtn" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 text-sm">
          🔒 Admin
        </button>
      </div>
    </div>

    <!-- STATUS BAR -->
    <div id="statusBar" class="bg-yellow-50 border border-yellow-200 rounded p-3 mb-6 hidden">
      <span id="statusText"></span>
      <button onclick="logout()" class="float-right text-sm text-red-600 hover:underline">Déconnexion</button>
    </div>

    <!-- SIMULATOR -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4">📋 Simulateur de Triage</h2>
      <div id="simulator" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      
      <div class="mt-6 flex flex-col sm:flex-row items-start gap-4">
        <button onclick="calculateTriage()" class="bg-green-600 text-white px-8 py-3 rounded-lg hover:bg-green-700 font-semibold w-full sm:w-auto">
          Calculer le Triage
        </button>
        
        <div id="ticketPreview" class="border-2 rounded-lg p-4 bg-gray-50 w-full sm:w-72">
          <p class="text-sm text-gray-600 mb-2">🎫 Aperçu du Ticket</p>
          <div id="ticketColor" class="text-5xl font-black">-</div>
          <p id="ticketLevel" class="text-xl font-bold mt-1"></p>
          <p id="ticketScore" class="text-sm text-gray-500"></p>
        </div>
      </div>
    </div>

    <!-- CONFIG EDITOR (hidden by default) -->
    <div id="editorSection" class="bg-white rounded-lg shadow p-6 mb-6 hidden">
      <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
        <h2 class="text-xl font-semibold">⚙️ Éditeur de Configuration</h2>
        <div class="flex gap-2">
          <button onclick="saveProposal()" id="saveProposalBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm hidden">
            💾 Proposer à l'admin
          </button>
          <button onclick="resetConfig()" class="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300 text-sm">
            🔄 Réinitialiser
          </button>
        </div>
      </div>
      <div id="configEditor"></div>
    </div>

    <!-- ADMIN PROPOSALS LIST -->
    <div id="adminProposalsSection" class="bg-white rounded-lg shadow p-6 mb-6 hidden">
      <h2 class="text-xl font-semibold mb-4">📨 Configurations Proposées par les Médecins</h2>
      <div id="proposalsList" class="space-y-3"></div>
    </div>

  </div>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-lg p-6 w-full max-w-md">
      <h3 id="loginTitle" class="text-xl font-bold mb-4"></h3>
      <input type="password" id="loginCodeInput" placeholder="Entrez votre code secret" 
             class="w-full border-2 rounded-lg px-4 py-2 mb-4 focus:border-blue-500" autocomplete="off">
      <p id="loginError" class="text-red-500 text-sm mb-4 hidden">❌ Code incorrect. Veuillez réessayer.</p>
      <div class="flex justify-end gap-2">
        <button onclick="closeLogin()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Annuler</button>
        <button onclick="submitLogin()" class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Valider</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ THIS MUST BE YOUR WORKER URL ⚠️
    const API_BASE = 'https://billowing-voice-4271.didcrist.workers.dev/api';
    
    // ─── GLOBAL STATE ───
    let activeConfig = null;
    let originalConfig = null;
    let doctorCode = null;
    let adminCode = null;
    let loginMode = null;

    // ─── LOAD ACTIVE CONFIG ───
    async function loadActiveConfig() {
      try {
        const response = await fetch(API_BASE + '/config');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const text = await response.text();
        activeConfig = JSON.parse(text);
        originalConfig = JSON.parse(text);
        renderSimulator();
        if (doctorCode || adminCode) showEditor();
      } catch (e) {
        console.error(e);
        document.getElementById('simulator').innerHTML = 
          '<p class="text-red-500">❌ Impossible de charger la configuration. Vérifiez que le Worker est déployé et la base D1 liée.</p>';
      }
    }

    // ─── RENDER SIMULATOR ───
    function renderSimulator() {
      if (!activeConfig) return;
      const container = document.getElementById('simulator');
      container.innerHTML = '';
      for (const [key, cat] of Object.entries(activeConfig)) {
        if (['thresholds','colors','levels'].includes(key)) continue;
        const div = document.createElement('div');
        div.className = 'border rounded-lg p-3';
        div.innerHTML = `<label class="block text-sm font-semibold mb-2 capitalize text-gray-700">${key.replace(/_/g,' ')}</label>`;
        const select = document.createElement('select');
        select.className = 'w-full border rounded px-3 py-2 text-sm bg-white';
        select.dataset.category = key;
        cat.options.forEach((opt, i) => {
          select.innerHTML += `<option value="${cat.scores[i]}">${opt} (${cat.scores[i]})</option>`;
        });
        div.appendChild(select);
        container.appendChild(div);
      }
    }

    // ─── CALCULATE ───
    function calculateTriage() {
      let total = 0;
      document.querySelectorAll('#simulator select').forEach(s => total += +s.value);
      const [gmax, ymax, omax] = activeConfig.thresholds;
      let idx = 0;
      if (total <= gmax) idx = 0;
      else if (total <= ymax) idx = 1;
      else if (total <= omax) idx = 2;
      else idx = 3;
      const color = activeConfig.colors[idx];
      const ticketColor = document.getElementById('ticketColor');
      ticketColor.textContent = '■';
      ticketColor.className = 'text-5xl font-black ' + ({
        green:'text-green-500', yellow:'text-yellow-500', orange:'text-orange-500', red:'text-red-600'
      })[color] || 'text-gray-600';
      document.getElementById('ticketLevel').textContent = activeConfig.levels[idx];
      document.getElementById('ticketScore').textContent = `Score : ${total}`;
    }

    // ─── EDITOR ───
    function showEditor() {
      document.getElementById('editorSection').classList.remove('hidden');
      const editor = document.getElementById('configEditor');
      editor.innerHTML = '';
      for (const [key, cat] of Object.entries(activeConfig)) {
        if (['thresholds','colors','levels'].includes(key)) continue;
        const card = document.createElement('div');
        card.className = 'border rounded-lg p-4 mb-4';
        card.innerHTML = `<h3 class="font-semibold mb-3 capitalize">${key.replace(/_/g,' ')}</h3>`;
        const table = document.createElement('table');
        table.className = 'w-full text-sm';
        table.innerHTML = '<thead><tr class="bg-gray-50"><th class="text-left p-1">Option</th><th class="text-left p-1 w-24">Score</th></tr></thead><tbody></tbody>';
        const tbody = table.querySelector('tbody');
        cat.options.forEach((opt, i) => {
          tbody.innerHTML += `<tr>
            <td class="p-1"><input type="text" value="${opt.replace(/"/g,'&quot;')}" data-cat="${key}" data-idx="${i}" data-field="option" class="w-full border rounded px-2 py-1 text-sm"></td>
            <td class="p-1"><input type="number" value="${cat.scores[i]}" data-cat="${key}" data-idx="${i}" data-field="score" class="w-20 border rounded px-2 py-1 text-sm"></td>
          </tr>`;
        });
        card.appendChild(table);
        const addBtn = document.createElement('button');
        addBtn.textContent = '+ Ajouter une option';
        addBtn.className = 'text-blue-600 text-sm mt-2 hover:underline';
        addBtn.onclick = () => { cat.options.push('Nouveau'); cat.scores.push(0); showEditor(); };
        card.appendChild(addBtn);
        editor.appendChild(card);
      }

      // Thresholds
      editor.innerHTML += `<div class="border rounded-lg p-4 mb-4">
        <h3 class="font-semibold mb-3">Seuils de Triage</h3>
        <div class="grid grid-cols-3 gap-4">
          <div><label class="text-xs">Vert max</label><input type="number" id="threshold0" value="${activeConfig.thresholds[0]}" class="w-full border rounded px-2 py-1"></div>
          <div><label class="text-xs">Jaune max</label><input type="number" id="threshold1" value="${activeConfig.thresholds[1]}" class="w-full border rounded px-2 py-1"></div>
          <div><label class="text-xs">Orange max</label><input type="number" id="threshold2" value="${activeConfig.thresholds[2]}" class="w-full border rounded px-2 py-1"></div>
        </div>
      </div>`;

      // Colors & levels
      editor.innerHTML += `<div class="border rounded-lg p-4 mb-4">
        <h3 class="font-semibold mb-3">Couleurs & Niveaux</h3>
        <div class="grid grid-cols-2 gap-2">
          ${[0,1,2,3].map(i => `
            <div><label class="text-xs">Couleur</label><input type="text" id="color${i}" value="${activeConfig.colors[i]}" class="w-full border rounded px-2 py-1"></div>
            <div><label class="text-xs">Niveau</label><input type="text" id="level${i}" value="${activeConfig.levels[i]}" class="w-full border rounded px-2 py-1"></div>
          `).join('')}
        </div>
      </div>`;

      // Attach listeners
      editor.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
        const cat = inp.dataset.cat, idx = +inp.dataset.idx, field = inp.dataset.field;
        if (cat && field === 'option') activeConfig[cat].options[idx] = inp.value;
        else if (cat && field === 'score') activeConfig[cat].scores[idx] = +inp.value || 0;
        else if (inp.id.startsWith('threshold')) activeConfig.thresholds[+inp.id.replace('threshold','')] = +inp.value || 0;
        else if (inp.id.startsWith('color')) activeConfig.colors[+inp.id.replace('color','')] = inp.value;
        else if (inp.id.startsWith('level')) activeConfig.levels[+inp.id.replace('level','')] = inp.value;
      }));
    }

    // ─── PROPOSE ───
    async function saveProposal() {
      if (!doctorCode) return alert('Connectez-vous en tant que médecin.');
      const name = prompt('Nom de la configuration :');
      if (!name) return;
      const description = prompt('Description (optionnelle) :');
      const res = await fetch(API_BASE + '/config/propose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Doctor-Code': doctorCode },
        body: JSON.stringify({ name, description, json_data: activeConfig })
      });
      if (res.ok) alert('✅ Proposition envoyée !');
      else alert('❌ Erreur');
    }

    function resetConfig() {
      if (confirm('Réinitialiser les changements ?')) {
        activeConfig = JSON.parse(JSON.stringify(originalConfig));
        showEditor();
      }
    }

    // ─── LOGIN ───
    function showLogin(mode) {
      loginMode = mode;
      document.getElementById('loginTitle').textContent = mode === 'doctor' ? '🔑 Code Médecin' : '🔒 Code Admin';
      document.getElementById('loginCodeInput').value = '';
      document.getElementById('loginError').classList.add('hidden');
      document.getElementById('loginModal').classList.remove('hidden');
    }
    function closeLogin() { document.getElementById('loginModal').classList.add('hidden'); }
    async function submitLogin() {
      const code = document.getElementById('loginCodeInput').value.trim();
      if (!code) return;
      if (loginMode === 'doctor') {
        const res = await fetch(API_BASE + '/doctor/validate', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({code})
        });
        const data = await res.json();
        if (data.valid) {
          doctorCode = code; adminCode = null;
          closeLogin();
          document.getElementById('statusBar').classList.remove('hidden');
          document.getElementById('statusText').textContent = '✅ Médecin ' + (data.name||'');
          document.getElementById('statusBar').className = 'bg-blue-50 border border-blue-200 rounded p-3 mb-6';
          document.getElementById('saveProposalBtn').classList.remove('hidden');
          document.getElementById('doctorBtn').textContent = '👨‍⚕️ Médecin ✓';
          document.getElementById('adminProposalsSection').classList.add('hidden');
          showEditor();
        } else document.getElementById('loginError').classList.remove('hidden');
      } else {
        // Admin login: test by fetching config list
        const res = await fetch(API_BASE + '/config/list', { headers: {'X-Admin-Code': code} });
        if (res.ok) {
          adminCode = code; doctorCode = null;
          closeLogin();
          document.getElementById('statusBar').classList.remove('hidden');
          document.getElementById('statusText').textContent = '✅ Admin';
          document.getElementById('statusBar').className = 'bg-red-50 border border-red-200 rounded p-3 mb-6';
          document.getElementById('saveProposalBtn').classList.add('hidden');
          document.getElementById('adminBtn').textContent = '🔒 Admin ✓';
          showEditor();
          loadProposalsList();
        } else document.getElementById('loginError').classList.remove('hidden');
      }
    }
    function logout() {
      doctorCode = null; adminCode = null;
      document.getElementById('statusBar').classList.add('hidden');
      document.getElementById('editorSection').classList.add('hidden');
      document.getElementById('adminProposalsSection').classList.add('hidden');
      document.getElementById('saveProposalBtn').classList.add('hidden');
      document.getElementById('doctorBtn').textContent = '👨‍⚕️ Médecin';
      document.getElementById('adminBtn').textContent = '🔒 Admin';
    }

    // ─── ADMIN PROPOSALS ───
    async function loadProposalsList() {
      if (!adminCode) return;
      const res = await fetch(API_BASE + '/config/list', { headers: {'X-Admin-Code': adminCode} });
      const configs = await res.json();
      const container = document.getElementById('proposalsList');
      container.innerHTML = '';
      document.getElementById('adminProposalsSection').classList.remove('hidden');
      if (configs.length === 0) container.innerHTML = '<p class="text-gray-500">Aucune proposition.</p>';
      configs.forEach(c => {
        const div = document.createElement('div');
        div.className = 'border rounded-lg p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2';
        div.innerHTML = `<div>
          <p class="font-semibold">${c.name}</p><p class="text-sm text-gray-600">${c.description||''}</p>
          <p class="text-xs text-gray-500">Status: ${c.status} ${c.doctor_code ? ' | Médecin: '+c.doctor_code : ''}</p>
        </div>
        ${c.status !== 'active' ? `<button onclick="activateConfig(${c.id})" class="bg-green-600 text-white px-4 py-2 rounded text-sm">✅ Activer</button>` : '<span class="text-green-600 font-semibold">✓ Actif</span>'}`;
        container.appendChild(div);
      });
    }

    window.activateConfig = async (id) => {
      if (!adminCode || !confirm('Activer cette configuration ?')) return;
      await fetch(API_BASE + '/config/activate', {
        method: 'PUT', headers: {'Content-Type':'application/json','X-Admin-Code': adminCode},
        body: JSON.stringify({id})
      });
      alert('✅ Activée !');
      await loadActiveConfig();
      loadProposalsList();
    };

    // Start
    loadActiveConfig();
  </script>
</body>
</html>
